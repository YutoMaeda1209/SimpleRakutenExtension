name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Get version from manifest
        id: version
        run: echo "version=$(jq -r .version src/manifest.json)" >> $GITHUB_OUTPUT

      - name: Fail if versions are inconsistent
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Version mismatch: package.json ($PKG_VERSION) != manifest.json (${{ steps.version.outputs.version }}). Keep them in sync before releasing."
            exit 1
          fi

      - name: Fail if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Bump version in src/manifest.json before releasing."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Zip dist
        run: cd dist && zip -r ../simple-rakuten-v${{ steps.version.outputs.version }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: simple-rakuten-v${{ steps.version.outputs.version }}.zip
